services:
  mysql:
    image: mysql:8.0.18
    container_name: mysql-diploma
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=Kx9#mPq2$$Lw7RvN4
      - MYSQL_DATABASE=app
      - MYSQL_USER=app
      - MYSQL_PASSWORD=App!Secur3#2026

  postgres:
    image: postgres:14-alpine
    container_name: postgres-diploma
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=App!Secur3#2026

  gate-simulator:
    image: node:8.16.2-alpine
    container_name: gate-simulator
    working_dir: /app
    volumes:
      - ./gate-simulator:/app
    ports:
      - "9999:9999"
    command: sh -c "npm install && npm start"